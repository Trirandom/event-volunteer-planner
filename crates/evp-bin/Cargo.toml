[package]
name         = "evp-bin"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
description  = "Composition root: configuration, wiring, main()."

# The service is `api` and the binary is `evp`. The production image puts it at
# /app/evp, which is what the compose healthcheck invokes.
[[bin]]
name = "evp"
path = "src/main.rs"

[dependencies]
evp-api    = { workspace = true }
evp-db     = { workspace = true }
evp-domain = { workspace = true }

anyhow             = { workspace = true }
axum               = { workspace = true }
clap               = { workspace = true }
figment            = { workspace = true }
jiff               = { workspace = true }
reqwest            = { workspace = true }
secrecy            = { workspace = true }
serde              = { workspace = true }
sqlx               = { workspace = true }
tokio              = { workspace = true }
tower              = { workspace = true }
tower-http         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
uuid               = { workspace = true }

[lints]
workspace = true
