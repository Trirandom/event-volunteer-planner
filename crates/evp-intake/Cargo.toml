[package]
name         = "evp-intake"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish.workspace      = true
description  = "Source connectors, the mapping/transform engine, and reconciliation."

# Depends on `evp-domain` and NOT on `evp-db`, deliberately. The mapping and
# reconciliation engine is a pure function over stored raw payloads
# (docs/02 §3), which is what makes it replayable and what keeps
# `cargo-mutants` over it affordable (docs/13 §9). Connectors that do I/O are
# expressed here as traits and implemented in `evp-worker`.
[dependencies]
evp-domain = { workspace = true }

csv        = { workspace = true }
jiff       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
uuid       = { workspace = true }

[dev-dependencies]
insta    = { workspace = true }
proptest = { workspace = true }
rstest   = { workspace = true }

[lints]
workspace = true
