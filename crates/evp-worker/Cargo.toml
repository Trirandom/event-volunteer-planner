[package]
name         = "evp-worker"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish.workspace      = true
description  = "Outbox consumer: email, SMS, ICS, sheet polling, the retention sweep."

[dependencies]
evp-db     = { workspace = true }
evp-domain = { workspace = true }
evp-intake = { workspace = true }

jiff       = { workspace = true }
# SMTP with the OS root store (docs/17 §7) — see the feature note on the
# workspace pin.
lettre     = { workspace = true }
minijinja  = { workspace = true }
reqwest    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
# OVH's SMS API signature (docs/02 §"Async work", ADR-0034) — see
# `sms::ovh` for why this is SHA-1 rather than the HMAC-SHA family the rest
# of the system uses.
sha1       = { workspace = true }
sqlx       = { workspace = true }
thiserror  = { workspace = true }
tokio      = { workspace = true }
tracing    = { workspace = true }

[lints]
workspace = true
