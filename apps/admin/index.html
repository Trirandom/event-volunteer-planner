<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Coordinator data is never a search result. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- One file, from packages/shared/public, so the coordinator tab and the
         volunteer tab cannot end up showing different marks. -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- The mark's green, so the browser chrome matches the page instead of
         framing it in the platform default. muted-teal-600 in both themes:
         the mark itself does not change with prefers-color-scheme. -->
    <meta name="theme-color" content="#4a8251" />
    <title>Event Volunteer Planner</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
