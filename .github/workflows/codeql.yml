#
# Static analysis (docs/06 §5, "CodeQL"). Separate from ci.yml because it
# answers a different question — not "does this build and pass" but "does
# this introduce a known-dangerous pattern" — and because the weekly run
# re-checks unchanged code against newly written queries. Findings land in the
# repository's Security tab; they do not gate image publishing.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # `actions` covers these workflows themselves: script injection
        # through `${{ }}`, over-broad tokens, untrusted checkouts.
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # build-mode `none`: CodeQL reads the sources without compiling them,
      # so this needs neither the toolchain nor a database.
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
